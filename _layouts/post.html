---
layout: default
---

<article class="post-full section">
  <div class="post-full-header">
    <a href="{{ '/blog/' | relative_url }}" class="back-link">← Back to Blog</a>
    <div class="section-label">Blog</div>
    <h1>{{ page.title }}</h1>
    <div class="post-meta">
      <span class="post-date">{{ page.date | date: "%B %d, %Y" }}</span>
      {% if page.tags %}
      <span class="post-tags">
        {% for tag in page.tags %}
        <span class="post-tag-pill">{{ tag }}</span>
        {% endfor %}
      </span>
      {% endif %}
    </div>
  </div>
  <div class="post-body">
    {{ content }}
  </div>
</article>
